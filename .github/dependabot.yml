version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "helm"
    directory: "/charts/trento-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "docker"
    directory: "/charts/trento-server"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
